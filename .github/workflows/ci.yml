# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  NEXT_PUBLIC_POCKETBASE_URL: https://micka.lhstudio.com.ar
  NEXT_PUBLIC_SITE_URL: https://micka-plum.vercel.app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: es donde el proyecto se desarrolla y verifica (tsc, lint,
          # vitest, next build). En Node 20 el CI moría en `npm ci` y nunca
          # llegó a correr un test - ver run 30035690373 (2026-07-23).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      - run: npx next build

  # Solo en pull_request: los e2e corren contra el PocketBase de PRODUCCIÓN
  # (el del cliente) y admin-crud escribe/borra un contact_message real. Correrlos
  # en cada push a master dejaría basura en la bandeja de Micka si un test falla
  # a mitad. En PR corren cuando hacen falta: justo antes de mergear.
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: es donde el proyecto se desarrolla y verifica (tsc, lint,
          # vitest, next build). En Node 20 el CI moría en `npm ci` y nunca
          # llegó a correr un test - ver run 30035690373 (2026-07-23).
          node-version: 24
          cache: npm
      - name: Check secrets
        id: gate
        env:
          PB_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          PB_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
        run: |
          if [ -n "$PB_EMAIL" ] && [ -n "$PB_PASSWORD" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped - POCKETBASE_* secrets not configured in repo settings"
          fi
      - name: Verify the secrets actually authenticate
        if: steps.gate.outputs.run == 'true'
        env:
          PB_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          PB_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
        run: |
          # Un secret presente no es un secret que sirva. La clave de servicio
          # de PocketBase se rota cada tanto y el secret del repo queda viejo
          # sin que nada avise: el gate de arriba sólo mira que no esté vacío.
          # Cuando eso pasa, los e2e mueren cinco minutos después con cuatro
          # timeouts de `waitForURL` que no dicen nada sobre la causa real
          # (ocurrió en el PR #2, 2026-08-21: el secret venía de julio y la
          # clave se había rotado el 11-ago). Un login real acá falla en
          # segundos y dice exactamente qué arreglar.
          AUTH_URL="$NEXT_PUBLIC_POCKETBASE_URL/api/collections/_superusers/auth-with-password"
          BODY=$(jq -nc --arg i "$PB_EMAIL" --arg p "$PB_PASSWORD" '{identity:$i,password:$p}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$AUTH_URL" -H 'Content-Type: application/json' --data "$BODY")
          if [ "$code" != "200" ]; then
            echo "::error::PocketBase rechazo POCKETBASE_ADMIN_* (HTTP $code). Si la clave de servicio se roto, actualiza los secrets en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Credenciales verificadas contra $NEXT_PUBLIC_POCKETBASE_URL"
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        env:
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
        run: npx playwright test
      - if: steps.gate.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
